version: '3.8'

services:
  prediction-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: production_prediction_service
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

